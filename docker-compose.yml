version: '3.8'

services:
  # PostgreSQL - Primary relational database
  postgres:
    image: postgres:15-alpine
    container_name: splitwise-postgres
    environment:
      POSTGRES_DB: splitwise
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: dev_password_change_in_production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d splitwise"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB - Activity logs, analytics, OCR metadata
  mongo:
    image: mongo:6
    container_name: splitwise-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: dev_password_change_in_production
      MONGO_INITDB_DATABASE: splitwise
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./backend/database/mongo-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/splitwise --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Caching and session storage
  redis:
    image: redis:7-alpine
    container_name: splitwise-redis
    command: redis-server --appendonly yes --requirepass dev_password_change_in_production
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO - S3-compatible object storage for receipts
  minio:
    image: minio/minio:latest
    container_name: splitwise-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: dev_password_change_in_production
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (uncomment when ready)
  # backend:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: splitwise-backend
  #   environment:
  #     NODE_ENV: development
  #     DATABASE_URL: postgresql://admin:dev_password_change_in_production@postgres:5432/splitwise
  #     MONGO_URL: mongodb://admin:dev_password_change_in_production@mongo:27017/splitwise?authSource=admin
  #     REDIS_URL: redis://:dev_password_change_in_production@redis:6379
  #     JWT_SECRET: your-super-secret-jwt-key-change-in-production
  #     JWT_REFRESH_SECRET: your-super-secret-refresh-key-change-in-production
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - ./backend:/app
  #     - /app/node_modules
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     mongo:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  minio_data:

networks:
  default:
    name: splitwise-network
